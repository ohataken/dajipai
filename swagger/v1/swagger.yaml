---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/cards/{card_uuid}/card_description":
    parameters:
    - name: card_uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Shows a card description
      tags:
      - Card Descriptions
      responses:
        '200':
          description: card description found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDescription"
        '404':
          description: card description not found
    post:
      summary: Creates a card description
      tags:
      - Card Descriptions
      parameters: []
      responses:
        '201':
          description: card description created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDescription"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardDescriptionInput"
    put:
      summary: Updates a card description
      tags:
      - Card Descriptions
      parameters: []
      responses:
        '200':
          description: card description updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CardDescription"
        '404':
          description: card description not found
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardDescriptionInput"
  "/api/cards":
    get:
      summary: Lists cards
      tags:
      - Cards
      responses:
        '200':
          description: cards listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Card"
    post:
      summary: Creates a card
      tags:
      - Cards
      parameters: []
      responses:
        '201':
          description: card created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Card"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardInput"
  "/api/cards/{uuid}":
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Shows a card
      tags:
      - Cards
      responses:
        '200':
          description: card found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Card"
        '404':
          description: card is draft
  "/api/owner/cards/{card_uuid}/tags":
    parameters:
    - name: card_uuid
      in: path
      required: true
      schema:
        type: string
    post:
      summary: Attaches a tag to a card
      tags:
      - Owner Card Tags
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: tag attached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Card"
        '200':
          description: tag already attached (idempotent)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Card"
        '422':
          description: tag not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '404':
          description: card not found
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CardTagInput"
  "/api/owner/cards/{card_uuid}/tags/{slug}":
    parameters:
    - name: card_uuid
      in: path
      required: true
      schema:
        type: string
    - name: slug
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Detaches a tag from a card
      tags:
      - Owner Card Tags
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: unknown tag slug (idempotent)
        '404':
          description: card not found
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/owner/cards/drafts":
    get:
      summary: Lists draft cards
      tags:
      - Owner Cards
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: draft cards listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/OwnerCard"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/owner/cards/drafts/{uuid}":
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Shows a draft card
      tags:
      - Owner Cards
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: draft card found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerCard"
        '404':
          description: draft card not found
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/owner/cards":
    post:
      summary: Creates a card
      tags:
      - Owner Cards
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: draft card created without pinyin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerCard"
        '422':
          description: published card without pinyin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OwnerCardInput"
  "/api/owner/cards/{uuid}":
    parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
    put:
      summary: Updates a card
      tags:
      - Owner Cards
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: card unpublished
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerCard"
        '404':
          description: card not found
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OwnerCardInput"
  "/api/owner/tags":
    post:
      summary: Creates a tag
      tags:
      - Owner Tags
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: tag created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OwnerTag"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagInput"
  "/api/tags/{tag_slug}/cards":
    parameters:
    - name: tag_slug
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Lists cards belonging to a tag
      tags:
      - Tags
      responses:
        '200':
          description: cards listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Card"
        '404':
          description: tag not found
  "/api/tags":
    get:
      summary: Lists tags
      tags:
      - Tags
      responses:
        '200':
          description: tags listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Tag"
servers:
- url: https://{defaultHost}
  variables:
    defaultHost:
      default: www.example.com
components:
  schemas:
    Card:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        pinyin:
          type: string
        tags:
          type: array
          items:
            "$ref": "#/components/schemas/Tag"
        card_description:
          type: object
          nullable: true
          properties:
            content:
              type: string
          required:
          - content
      required:
      - uuid
      - name
      - pinyin
      - tags
      - card_description
    CardDescription:
      type: object
      properties:
        content:
          type: string
      required:
      - content
    Tag:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - slug
      - name
    OwnerCard:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        name:
          type: string
        pinyin:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - uuid
      - name
      - pinyin
      - published_at
      - created_at
      - updated_at
    OwnerTag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - slug
      - created_at
      - updated_at
    CardInput:
      type: object
      properties:
        card:
          type: object
          properties:
            name:
              type: string
            pinyin:
              type: string
          required:
          - name
          - pinyin
      required:
      - card
    OwnerCardInput:
      type: object
      properties:
        card:
          type: object
          properties:
            name:
              type: string
            pinyin:
              type: string
            published_at:
              type: string
              format: date-time
              nullable: true
          required:
          - name
      required:
      - card
    CardDescriptionInput:
      type: object
      properties:
        card_description:
          type: object
          properties:
            content:
              type: string
          required:
          - content
      required:
      - card_description
    TagInput:
      type: object
      properties:
        tag:
          type: object
          properties:
            name:
              type: string
            slug:
              type: string
          required:
          - name
          - slug
      required:
      - tag
    CardTagInput:
      type: object
      properties:
        tag_slug:
          type: string
      required:
      - tag_slug
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
